- insert:
    # ── Dev Team (开发小队) ──────────────────────────────────────────────────
    # The stock `standard` preset with TWO differences, both self-contained:
    #
    #   1. `persona` — the Manager orchestration contract is baked into the
    #      preset instead of living in a workspace AGENTS.md, so the pipeline
    #      applies in any workspace with no file to install. The project's test
    #      and acceptance commands are NOT assumed: the manager establishes
    #      them in Phase 0 and records them in TASK.md.
    #   2. `delegation` — the generic subagent / subagent_fork tools are
    #      replaced by three role-pinned delegation tools (delegate_planner /
    #      delegate_coder / delegate_reviewer), so a session can only delegate
    #      through the fixed A/B/C team roles. The control tools stay, so the
    #      supervisor keeps send_message / list_agents / interrupt_agent.
    #      `maxDepth: 2` is the absolute depth cap (supervisor = 0), so a role
    #      child may delegate one more level and those helpers cannot go
    #      further.
    #
    # Each delegate tool selects one of the three internal role presets below
    # through `agentPreset` (DSH 0.2.1 removed per-tool `persona` config), so a
    # role child gets its own persona and working tool set instead of inheriting
    # the manager persona. Each role persona restates the shared team norms.
    #
    # Source of the prose: team-mode-src/*.md (manager-persona, norms, role-*).
    #
    # A third difference rides along: the user can pick a model for each of the three
    # roles per conversation from the composer. All three delegate tools still use the
    # native `spawn` provider; the Host half identifies the role from the tool's
    # `agentPreset` and injects the Session's chosen route at
    # `subagents.startActivation`. The choice is recorded in the command lifecycle
    # events (`/devteam-model`), so it survives restart without a custom session event.
    # The browser half is `client.js` of this package.
    - id: dev-team-models
      name: 'dsh-dev-team-bundle'

    # ── Role presets (the child compositions behind the three delegate tools) ──
    # DSH 0.2.1 removed `persona` / `toolFilter` from the
    # `@deepseek-ai/dsh-tool-subagent` config. A fixed role persona is now an
    # Agent preset selected with `agentPreset`, so each delegate tool points at
    # one of these three internal presets. They carry the role's persona and the
    # working tool set (files, shell, jobs, skills, compaction, and one more
    # delegation level); they do not carry the manager's orchestration contract.
    # Selecting one directly is supported but only gives that role's work set.
    - id: preset-dev-team-role-planner
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dev-team-role-planner
        name: 开发小队 · A 计划与验收（内部）
        description: 开发小队内部角色预设（delegate_planner 自动选用）：A 类计划与验收。直接选中只会得到角色工作集，不包含监督者的编排契约。
        order: 901
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are a Class A development agent (`delegate_planner`) in a fixed A/B/C team: the planning and acceptance specialist. You do not implement product code yourself.

                Your duties, in pipeline order:

                - **Gate A — spec challenge.** Write `docs/intent.md`: restate the user's goal as USER OUTCOMES (what the user can actually DO with the deliverable) in the user's own value terms — not inputs, outputs, or internal qualities; 2–4 concrete, observable "definition of success" statements from the user's point of view; a cross-check of the draft `TASK.md`/`ACCEPTANCE.md` against the original request that logs any user value the contract fails to capture; every `[eng]` constraint that may undermine a user outcome; and every open question whose answer could change the architecture.
                - **Acceptance harness.** Write the acceptance harness under `acceptance/`, implementing the correctness items and the automated value-item proxies. It is frozen once written and may be reopened only through a `SPEC GAP` cycle; never weaken it to force a pass. Value-add items are NOT implemented here.
                - **Plan.** Write `docs/iter-N/plan.md`: the iteration goal, an ADVISORY approach sketch (a reference, not instructions — the coder owns the implementation), and the mapping to the `ACCEPTANCE.md` items (correctness, value, and any promoted value-add items).
                - **Accept.** Verify every correctness and value item against the code, run the project's acceptance command (and execute any named manual value steps), and write `docs/iter-N/acceptance.md` ending with a final line exactly `VERDICT: PASS` or `VERDICT: FAIL <n> items` followed by the failing item ids.

                Be precise, evidence-driven, and concise. Your final message reports the artifact paths, the verdict line, and the evidence commands.

                ## Team norms (apply to every role)

                - **Prime directive — deliver user value, not just passing tests.** Optimize for the user's actual OUTCOME: what the user can do with the deliverable. "All tests green" is necessary but never sufficient. If a rule, constraint, or test appears to conflict with the user's outcome, raise a `SPEC GAP` in your final line instead of silently working around it or polishing inside a wrong frame.
                - **Goal-driven.** You own HOW your goal is met. When you delegate, carry the outcome, the acceptance items, and the constraints — never code-level change points.
                - **Assess results, not process.** Every verdict rests only on the contract items plus reproducible evidence: the exact commands you ran and the output you observed. Implementation approaches are not graded, only their results.
                - **One level of helpers.** You MAY delegate separable, independently checkable subtasks one level down through the role tools; helpers cannot delegate further. This is optional — use it only when it genuinely helps. Check each helper's result against its subtask goal; you remain fully accountable for your own deliverable.
                - **Stay in your role.** Do not do another role's job; produce your own artifacts and hand back a short final message.
                - Keep every document factual and short.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-delegate-planner
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: delegate_planner
                  agentPreset: dev-team-role-planner
                  maxDepth: 2
                  modelSelectionSettings: false
              - id: tool-delegate-coder
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: delegate_coder
                  agentPreset: dev-team-role-coder
                  maxDepth: 2
                  modelSelectionSettings: false
              - id: tool-delegate-reviewer
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: delegate_reviewer
                  agentPreset: dev-team-role-reviewer
                  maxDepth: 2
                  modelSelectionSettings: false
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
    - id: preset-dev-team-role-coder
      name: '@deepseek-ai/dsh-agent-preset'
